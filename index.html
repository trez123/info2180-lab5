<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>World Database Lookup</title>

    <!-- you can modify this as needed or to your preference -->
    <link href="world.css" type="text/css" rel="stylesheet" />

    <!-- you write this -->
    <script src="world.js" type="text/javascript"></script>
  </head>

  <body>
    <header>
      <img class="world-img" src="world.png" alt="World Database Lookup" />
      <h1>World Database Lookup</h1>
    </header>

    <main>
      <div id="controls">
        <label class="custom-label" for="country">Country:</label>
        <input
          id="country"
          type="search"
          name="country"
          class="custom-input"
          placeholder="Enter country name"
        />
        <button class="custom-button" id="lookup">Lookup</button>
        <button class="custom-button" id="lookup-cities">Lookup Cities</button>
      </div>

      <div id="result">
        <!-- countries will appear here -->
      </div>
    </main>
  </body>
</html>
